name: Daily Digest

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily (08:00 Helsinki in summer)

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run digest agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python digest.py
      - name: Commit state and digest archive
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add state.json digests/ || true
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%F)"
          git push
